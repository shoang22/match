# PYTHONPATH=$(pwd) PYOPENGL_PLATFORM=egl conda run -n match --no-capture-output python condor/run.py configs/tempeh/save_predictions_seq_SEN_a_good_morrow.yml
# TEMPEH coarse meshes and UV maps for all 40 frames of TCE049's SEN_a_good_morrow_to_you_my_boy segment (input to the MATCH sequence evaluation).
# Same camera angles and sizes as save_predictions_quickstart.yml, but the segment is selected by name, stride 1, no sample cap, and a separate out_dir.
# Output: ${out_dir}/ava-256/TCE049/SEN_a_good_morrow_to_you_my_boy/<frame>/{verts.npy, uv_cam<ID>.png x 12}. Frames whose outputs exist are skipped on rerun.


name: save_predictions-seq_SEN_a_good_morrow
data_dir: data/ava-256
out_dir: data/tempeh_predictions/ava-256/seq_SEN_a_good_morrow
segment: SEN_a_good_morrow_to_you_my_boy
script: scripts/tempeh/save_predictions.py
tempeh_config: assets/pretrained_models/tempeh/config.json
arguments: "--config-filename ${tempeh_config} \
            --dataset-directory ${data_dir} \
            --subjects '[\"TCE049\"]' \
            --segment ${segment} \
            --camera-angles '[[0,0], [0, -15], [20,0], [20, 36], [20, -15], [-20,0], [-20, 36], [-20, -15], [40,-5], [40, 25], [-40,-5], [-40, 25]]' \
            --height 256 \
            --width 167 \
            --frame-stride 1 \
            --max-captures -1 \
            --outpath ${out_dir} \
            --uv-out-height 786 \
            --uv-out-width 512 \
            --uv-n-samples -1"  # Number of samples to predict for (-1 = all)


# condor configs
CondorParameters:
  name: ${name}
  batch_name: ${name}
  cmd: 'python ${script} ${arguments}'
  requirements: '(TARGET.CUDACapability >= 8.0)'
  base_dir: ${out_dir}
  request_gpus: 1
  request_cpus: 16
  request_memory: 64_000
  request_disk: 50G
  backup_excludepatterns: ['third_party']
  environment: {'CC': 'gcc-11', 'CXX':'g++-11'}
  njobs: 1
  retries: 0
